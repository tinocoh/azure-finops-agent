server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service. BACKEND_URL is resolved via the
    # docker-compose network (service name "backend") or the Container App FQDN.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        # Azure Container Apps ingress routes by SNI + Host. When BACKEND_URL is
        # https, nginx must send SNI and set Host to the backend FQDN ($proxy_host),
        # otherwise the ingress returns 502. For local http (compose) these are
        # harmless no-ops.
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
